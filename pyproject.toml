[project]
name = "cot2dag"
version = "0.1.0"
description = "Resumable asynchronous CoT-to-DAG batch processing"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "instructor>=1.0",
    "litellm>=1.40",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "seaborn>=0.13",
    "tenacity>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
