paths:
  input_json: data\cot-3\gpt-5.6-sol-xhigh\cot.json
  database: data\cot-3\gpt-5.6-sol-xhigh\dag.sqlite3
  output_json: data\cot-3\gpt-5.6-sol-xhigh\dag.json
  system_prompt: docs/prompt/cot_to_dag_system.md

model:
  # LiteLLM 模型名；请按中转站支持的模型或 provider 前缀修改。
  litellm_model: openai/gpt-5.4-mini
  # 中转站的 OpenAI 兼容基础地址；通常不是敏感信息。
  api_base: https://www.codex2api.com/v1
  api_key_env: CODEX_2_API_API_KEY
  timeout_s: 45
  max_concurrency: 200
  completion_kwargs:
    temperature: 0.1
  min_request_interval_s: 0.0
  stream: true

retry:
  # max_attempts 包含首次请求。
  max_attempts: 3
  min_wait_s: 2
  max_wait_s: 60
  retry_invalid_output: true
